<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="VR Power Diesel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VR One | VR Power Diesel</title>
<style>
:root{--bd:#d8d8d8;--hl:#ffe000;--dk:#111;--ac:#0b6efd}
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 system-ui,Segoe UI,Arial,sans-serif;background:#f4f5f7;color:#111}
header{background:var(--dk);color:#fff;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:15px}
.wrap{padding:14px;max-width:100%}
table{border-collapse:collapse;width:100%;background:#fff;font-size:12px}
th,td{border:1px solid var(--bd);padding:4px 6px;text-align:left;vertical-align:middle}
th{background:#222;color:#fff;white-space:normal}
th .cl{display:block;font-size:11px;margin-bottom:3px;white-space:nowrap}
th input,th select{width:100%;max-width:118px;padding:2px 4px;font-size:11px}
th.date,td.date{background:var(--hl);color:#111}
tr:nth-child(even) td{background:#fafafa}
tr:nth-child(even) td.date{background:#fff3a8}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:8px}
input,select,button{font:inherit;padding:5px 7px;border:1px solid #bbb;border-radius:6px;background:#fff}
input[type=password],input[type=text]{width:100%}
td input,td select{min-width:0;padding:3px 4px}
button{cursor:pointer;background:#eee;min-height:38px}
input,select{font-size:16px} /* mobile zoom rokne ke liye 16px */
td input,td select{min-height:42px}
.sticky-submit{position:sticky;bottom:0;background:#fff;padding:10px 0;border-top:1px solid #ddd;margin-top:12px}
.sticky-submit button{width:100%;padding:12px;font-size:15px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{background:#c62828;color:#fff;border-color:#c62828}
button.g{background:#137d3c;color:#fff;border-color:#137d3c}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:16px;max-width:420px;margin:40px auto}
.card h2{margin:0 0 12px;font-size:17px}
label{display:block;margin:9px 0 4px;font-weight:600;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button.on{background:var(--dk);color:#fff;border-color:var(--dk)}
.msg{padding:8px 10px;border-radius:7px;margin:8px 0;font-size:12px}
.msg.e{background:#fde8e8;color:#a40000;border:1px solid #f5b5b5}
.msg.o{background:#e8f5ec;color:#0b6b32;border:1px solid #b5e0c4}
.msg.i{background:#eaf2ff;color:#0b3d91;border:1px solid #b9d2ff}
.otp{font:700 20px monospace;letter-spacing:5px;background:#111;color:#0f0;padding:8px 12px;border-radius:6px;display:inline-block}
.small{font-size:11px;color:#555}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:150px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.badge{padding:2px 7px;border-radius:20px;font-size:11px;background:#eee}
.badge.ok{background:#d6f5e0;color:#0b6b32}
.badge.no{background:#ffdcdc;color:#a40000}
.chk{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-weight:400;margin:0}
.chk input{width:auto}
#err{display:none;margin:10px;padding:10px;border:1px solid #f5b5b5;background:#fde8e8;color:#a40000;border-radius:8px;font:12px monospace;white-space:pre-wrap}
@media (max-width:820px){
  .wrap{padding:8px}
  header{padding:8px 10px}
  .tw{overflow:auto;border:1px solid var(--bd);border-radius:8px;-webkit-overflow-scrolling:touch}
  table{min-width:0}
  header{position:sticky;top:0;z-index:10}
  table{display:block;width:100%;background:transparent;font-size:12px}
  thead{display:block;background:#222;border-radius:9px;padding:8px 10px;margin-bottom:10px}
  thead.nofilter{display:none}
  thead tr{display:block}
  thead th{display:grid;grid-template-columns:44% 56%;align-items:center;gap:8px;border:0;border-bottom:1px solid #333;padding:5px 0;background:transparent!important;color:#fff}
  thead th:last-child{border-bottom:0}
  thead th .cl{margin:0;white-space:normal}
  thead th input,thead th select{max-width:none;width:100%;font-size:12px;padding:4px 6px}
  tbody{display:block}
  tbody tr{display:block;background:#fff;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;padding:4px 10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  tbody td{display:grid;grid-template-columns:44% 56%;gap:8px;align-items:center;border:0;border-bottom:1px dashed #ececec;padding:6px 0;background:#fff!important;word-break:break-word}
  tbody td:last-child{border-bottom:0}
  tbody td::before{content:attr(data-label);font-size:11px;font-weight:700;color:#666}
  tbody td.date{background:#fffbe0!important}
  tbody td select,tbody td input{width:100%}
  .grid3{grid-template-columns:1fr}
  .card{max-width:none;margin:14px 0}
  .tabs button{padding:6px 9px;font-size:12px}
  .row .grow{min-width:120px}
}


/* ===== VR ONE modern ===== */
.vrone-splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(900px 500px at 50% -10%,#1e3a8a,transparent),linear-gradient(160deg,#050816,#0f172a 55%,#0b3b2e);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;transition:opacity .45s,visibility .45s}
.vrone-splash.hide{opacity:0;visibility:hidden}
.vrone-logo{width:92px;height:92px;border-radius:28px;background:linear-gradient(135deg,#facc15,#f97316);display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 18px 50px rgba(249,115,22,.45)}
.vrone-name{font-size:44px;font-weight:900;letter-spacing:2px;line-height:1}
.vrone-name span{color:#facc15}
.vrone-sub{color:#cbd5e1;font-size:14px;letter-spacing:.18em;text-transform:uppercase}
.vrone-tag{margin-top:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 14px;border-radius:999px;font-size:12px}
.vrone-card{overflow:hidden;border-radius:18px!important;box-shadow:0 18px 45px rgba(2,6,23,.18)!important}
.vrone-top{background:linear-gradient(135deg,#0f172a,#1e3a8a 60%,#0b6b3a);color:#fff;margin:-16px -16px 16px;padding:22px 18px 18px;text-align:center}
.vrone-top .vrone-logo{width:58px;height:58px;border-radius:16px;font-size:28px;margin:0 auto 8px}
.vrone-top h2{margin:0;font-size:26px;letter-spacing:1px}
.vrone-top h2 span{color:#facc15}
.stockbar{position:sticky;top:52px;z-index:15;background:linear-gradient(90deg,#fef3c7,#fde68a);border:1px solid #f59e0b;border-radius:12px;padding:9px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:800;margin-bottom:12px;box-shadow:0 4px 14px rgba(245,158,11,.18)}
.stockbar small{font-weight:600;color:#92400e}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.65);z-index:9998;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 10px 10px;padding:18px;max-height:85vh;overflow:auto}
.sumrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #e2e8f0}
.sumtotal{display:flex;justify-content:space-between;font-size:17px;font-weight:900;padding:12px 0 4px}
.pill{font-size:11px;background:#dcfce7;color:#166534;border-radius:999px;padding:3px 8px;font-weight:700}

/*MAIN - FULL PAGE, VR ONE upar compact, Login usi screen me*/ .vrone-splash{background:linear-gradient(180deg,#0F0F14 0%,#1C1C22 38%,#D8D0BE 72%,#F5EEDD 100%)!important} .vrone-name{font-family:Georgia,serif;font-size:52px;font-weight:900;letter-spacing:8px;line-height:1;color:#EDEDED!important;animation:vrDrop 1s cubic-bezier(.2,1.4,.4,1) both} .vrone-name span{background:linear-gradient(180deg,#FFE27A,#FFC107 45%,#FF7A00)!important;-webkit-background-clip:text;background-clip:text;color:transparent!important;filter:drop-shadow(0 2px 14px rgba(255,170,0,.8))} @keyframes vrDrop{0%{opacity:0;transform:translateY(-160px) scale(.9)}55%{opacity:1;transform:translateY(14px) scale(1.02)}70%{transform:translateY(-10px)}85%{transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}} .gold-line{width:130px;height:4px;border-radius:99px;background:linear-gradient(90deg,#8A6D1A,#FFD700,#FF8A00,#FFC107,#8A6D1A);margin:8px auto 0;box-shadow:0 0 16px rgba(255,190,0,.9);animation:lineIn .7s ease both .7s} @keyframes lineIn{0%{opacity:0;transform:scaleX(.2)}100%{opacity:1;transform:scaleX(1)}} .vrone-sub{color:#F5EEDD!important;font-size:15px!important;font-weight:800;letter-spacing:.32em;margin-top:26px;animation:fadeUp .7s ease both 1s} .vrone-tag{display:none} @keyframes deptIn{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}} @keyframes fadeUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}} .vrone-fullpage{position:fixed;inset:0;z-index:9998;overflow-y:auto;overflow-x:hidden;background:linear-gradient(180deg,#0F0F14 0%,#1C1C22 38%,#D8D0BE 72%,#F5EEDD 100%)} .vrone-hero{padding:28px 20px 26px;text-align:center} .vr-one-big{font-family:Georgia,serif;font-size:44px;font-weight:900;letter-spacing:6px;line-height:1;margin:0;color:#EDEDED;text-shadow:0 3px 18px rgba(0,0,0,.7);animation:vrDrop 1s cubic-bezier(.2,1.4,.4,1) both} .vr-one-big span{background:linear-gradient(180deg,#FFE27A,#FFC107 45%,#FF7A00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(255,170,0,.8))} .dept-label{color:#F5EEDD;font-size:13px;font-weight:800;letter-spacing:.32em;margin:10px 0 0;text-shadow:0 2px 10px rgba(0,0,0,.8);animation:deptIn .8s ease both 1.1s} .vrone-login{padding:14px 20px 16px;background:#F5EEDD;max-width:480px;margin:6px auto 0 auto} .vrone-login label{color:#1C1C22!important;font-weight:700;font-size:13px;margin:7px 0 4px;text-align:left} .vrone-login input[type=text],.vrone-login input[type=password],.vrone-login input:not([type=checkbox]){width:100%!important;background:#fff!important;border:1.5px solid #B8AE96!important;color:#1C1C22!important;border-radius:10px!important;padding:9px 12px!important;font-size:14px!important;outline:none} .vrone-login input:focus{border-color:#3B82F6!important;box-shadow:0 0 0 3px rgba(59,130,246,.25)!important} .g-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none!important;border:0!important;color:#6b6350!important;font-size:18px;min-height:0!important;padding:4px 6px;cursor:pointer} .g-btn{width:100%;background:linear-gradient(90deg,#3B82F6,#2563EB)!important;color:#fff!important;border:0!important;border-radius:10px!important;padding:10px!important;font-size:15px;font-weight:700!important;margin-top:10px} .g-forgot{display:block;text-align:right;color:#2563EB!important;font-size:13px;margin-top:8px;cursor:pointer;font-weight:600} .g-remember{color:#1C1C22!important;background:transparent!important;border:0!important;padding-left:0!important;font-weight:600!important}
/* ===== Software / App look ===== */
:root{--bd:#e3e7ee;--dk:#0f172a;--ac:#2563eb;--bg:#eef2f7;--sh:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.05)}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0)}
header{background:linear-gradient(135deg,#0f172a,#1e3a8a);padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px));box-shadow:0 2px 10px rgba(0,0,0,.25);position:sticky;top:0;z-index:20}
header b{font-size:16px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
header b::before{content:"\26FD";display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;background:rgba(255,255,255,.15);border-radius:8px;font-size:16px}
#hdr .small{background:rgba(255,255,255,.14);padding:4px 10px;border-radius:20px;color:#fff!important}
.wrap{max-width:1400px;margin:0 auto;padding:18px}
.tw{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);max-height:calc(100vh - 210px);overflow:auto}
table{font-size:13px}
th,td{border:0;border-bottom:1px solid #edf0f5;padding:10px 12px}
th{background:#f1f5f9;color:#334155;font-weight:600;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--bd)}
th .cl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#475569;margin-bottom:5px}
th input,th select{max-width:none;min-width:110px;background:#fff;border:1px solid #cfd6e2;border-radius:8px;padding:6px 8px;font-size:13px;min-height:36px}
tr:nth-child(even) td{background:#fff}
tbody tr:hover td{background:#f5f8ff!important}
input,select,button{border-radius:10px;border:1px solid #cfd6e2}
input:focus,select:focus{outline:2px solid rgba(37,99,235,.35);border-color:var(--ac)}
button{font-weight:600;background:#fff;color:#1e293b;transition:transform .08s,box-shadow .15s;box-shadow:0 1px 2px rgba(15,23,42,.06)}
button:active{transform:scale(.97)}
button.p{background:var(--ac)}button.g{background:#16a34a;border-color:#16a34a}button.d{background:#dc2626;border-color:#dc2626}
.card{border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:22px;margin:8vh auto 0}
.card h2{font-size:20px}
.badge{font-weight:600}
.tabs button{border-radius:20px}
.small{color:#64748b}
.sticky-submit{box-shadow:0 -4px 12px rgba(15,23,42,.06);padding:10px 12px;border-radius:12px 12px 0 0;border:1px solid var(--bd)}
@media (max-width:820px){
  .wrap{padding:10px}
  header{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  header b{font-size:14px}
  .tw{max-height:none;background:transparent;border:0;box-shadow:none;overflow:visible}
  thead{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  thead.nofilter{display:none}
  thead tr{display:contents}
  thead th{display:block;border:0;padding:0;background:transparent!important;color:#334155;position:static}
  thead th .cl{display:block;margin-bottom:3px;white-space:normal}
  thead th input,thead th select{min-width:0;width:100%;font-size:14px}
  tbody tr{border-radius:14px;padding:6px 14px;box-shadow:var(--sh);border:1px solid var(--bd)}
  tbody td{border-bottom:1px solid #f0f2f6!important;padding:8px 0;grid-template-columns:48% 52%}
  tbody td::before{color:#64748b;font-weight:600;font-size:12px}
  tbody tr:hover td{background:#fff!important}
  .card{margin:6vh 0 0;padding:18px}
  button{min-height:44px}
}

/* viewer: compact one-line list */
.vw{max-height:calc(100vh - 230px);overflow:auto;background:#fff!important;border:1px solid var(--bd)!important;border-radius:12px!important;box-shadow:var(--sh)!important}
.vw table{display:table!important;width:100%;border-collapse:collapse;font-size:12px}
.vw thead{display:table-header-group!important;background:#f1f5f9!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:0!important;grid-template-columns:none!important}
.vw tbody{display:table-row-group!important}
.vw tr{display:table-row!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important}
.vw th,.vw td{display:table-cell!important;padding:7px 6px!important;border:0!important;border-bottom:1px solid #edf0f5!important;vertical-align:top;text-align:left;grid-template-columns:none!important;background:transparent}
.vw th{position:sticky;top:0;background:#f1f5f9!important;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:#475569;z-index:2}
.vw td::before{display:none!important}
.vw td:first-child{white-space:nowrap;font-weight:600}
@media (max-width:820px){ .vw{max-height:none} .vw table{font-size:11.5px} .vw th,.vw td{padding:6px 4px!important} }

.vw select,.vw input{min-width:0;min-height:30px;padding:3px 4px;font-size:12px;width:auto;max-width:110px}
.vw td:first-child{white-space:nowrap}

/* filler: phone rotate (landscape) => full table, all columns fit */
@media (orientation:landscape) and (max-width:1000px){
 .ft{max-height:none!important;overflow-x:auto!important;background:#fff!important;border:1px solid var(--bd)!important;border-radius:12px!important;box-shadow:var(--sh)!important}
 .ft table{display:table!important;width:100%;border-collapse:collapse;font-size:10.5px}
 .ft thead,.ft thead.nofilter{display:table-header-group!important;background:#f1f5f9!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:0!important;grid-template-columns:none!important}
 .ft thead tr{display:table-row!important}
 .ft tbody{display:table-row-group!important}
 .ft tbody tr{display:table-row!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important}
 .ft th,.ft td{display:table-cell!important;padding:4px 3px!important;border:0!important;border-bottom:1px solid #edf0f5!important;vertical-align:middle;text-align:left;grid-template-columns:none!important;background:transparent;word-break:break-word}
 .ft th{position:sticky;top:0;background:#f1f5f9!important;font-size:9.5px;text-transform:uppercase;letter-spacing:.2px;color:#475569;z-index:2;line-height:1.15}
 .ft td::before{display:none!important}
 .ft select,.ft input{min-width:0!important;width:100%!important;max-width:64px;min-height:26px!important;padding:2px 2px!important;font-size:10.5px!important}
 .ft .badge{font-size:9.5px;padding:1px 5px}
 .wrap{padding:6px}
}

.fp{background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:8px 12px;margin-bottom:10px}
.fp summary{cursor:pointer;font-weight:600;color:#334155;min-height:28px;display:flex;align-items:center}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.fg label{display:block;font-size:11px;color:#475569;font-weight:600}
.fg label span{display:block;margin-bottom:2px}
.fg input,.fg select{width:100%;min-height:36px;padding:6px 8px;font-size:13px}
@media (max-width:820px){ .fg{grid-template-columns:1fr 1fr} }

/* ===== FIT: no side scroll, everything on one page ===== */
.fpm{display:none}
.fit{overflow:visible!important;max-height:none!important}
.fit table{display:table!important;width:100%!important;table-layout:auto;border-collapse:collapse}
.fit thead,.fit thead.nofilter{display:table-header-group!important}
.fit tbody{display:table-row-group!important}
.fit tr,.fit thead tr{display:table-row!important}
.fit th,.fit td{display:table-cell!important;word-break:break-word;overflow-wrap:anywhere;white-space:normal!important;vertical-align:middle}
.fit th{position:sticky;top:54px;z-index:3}
.fit th input,.fit th select{min-width:0!important;width:100%!important}
@media (min-width:821px){
  .fit table{font-size:12.5px}
  .fit th,.fit td{padding:6px 5px!important}
  .fit th{font-size:11px}
  .fit select,.fit input{min-width:0!important;max-width:100%!important}
}
@media (max-width:820px){
  .fpm{display:block}
  .fit{background:#fff!important;border:1px solid var(--bd)!important;border-radius:10px!important;box-shadow:var(--sh)!important}
  .fit table{font-size:9px}
  .fit thead,.fit thead.nofilter{background:#f1f5f9!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:0!important;grid-template-columns:none!important}
  .fit tbody tr{box-shadow:none!important;border:0!important;border-radius:0!important;padding:0!important}
  .fit th,.fit td{padding:3px 2px!important;border:0!important;border-bottom:1px solid #edf0f5!important;grid-template-columns:none!important;text-align:left;font-size:9px;background:transparent}
  .fit th{top:calc(50px + env(safe-area-inset-top,0px));background:#f1f5f9!important;font-size:7.5px;line-height:1.1;text-transform:uppercase;letter-spacing:0;color:#475569}
  .fit th .cl{font-size:7.5px;margin:0;white-space:normal}
  .fit th input,.fit th select{display:none!important}
  .fit td::before{display:none!important}
  .fit select,.fit input{width:100%!important;min-width:0!important;max-width:none!important;min-height:22px!important;padding:0 1px!important;font-size:9px!important;border-radius:5px}
  .fit .badge{font-size:7.5px;padding:0 3px}
  .wrap{padding:6px}
}

/* viewer: single-line rows + always-visible filter row */

<div class="wrap" id="app"></div>
<script>

<script>
var KEY='dsl_db_v1', SKEY='dsl_sess';
var LF=String.fromCharCode(10), CR=String.fromCharCode(13), BOM=String.fromCharCode(65279);
var QTY=[]; for(var qi=1;qi<=11;qi++){ QTY.push(qi*20); }
function last4(c){ return String(c).slice(-4); }
function cardDisp(c){
  c=String(c==null?'':c).trim(); var m;
  if((m=/^OTCINDUSRAJ(\d+)$/i.exec(c))) return ('0000'+m[1]).slice(-4);
  if((m=/^RAJ(\d+)$/i.exec(c))) return m[1].slice(-3);
  if((m=/(\d+)$/.exec(c))) return ('0000'+m[1]).slice(-4);
  return c.slice(-4);
}
var CW={indus:15,site:26,stock:8,card:8,cur:9,req:8,hrs:9,avg:9,tech:11,date:9,remark:14,status:10};
function cg(keys){
  var t=0; keys.forEach(function(k){ t+=(CW[k]||9); });
  return '<colgroup>'+keys.map(function(k){ return '<col style="width:'+(((CW[k]||9)*100)/t).toFixed(2)+'%">'; }).join('')+'</colgroup>';
}
function qq(s){ return "'" + s + "'"; }
var filters={}, adminTab='data', pendingOtp=null, otpPhone='';

var BASECOLS=[['indus','ID'],['site','Site Name'],['stock','FS Stock'],['card','Card No'],
  ['cur','SNMP Stock'],['req','Diesel Req.'],['hrs','SNMP DG RH'],['avg','Avg SNMP RH'],['tech','Tech']];
var ALLVIS={indus:1,site:1,stock:1,card:1,cur:1,req:1,hrs:1,avg:1,tech:1,remark:1};

var mem={};
var store={
  get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del:function(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};


function fmtStockDate(iso){ if(!iso) return ''; var m={'01':'Jan','02':'Feb','03':'Mar','04':'Apr','05':'May','06':'Jun','07':'Jul','08':'Aug','09':'Sep','10':'Oct','11':'Nov','12':'Dec'}; var a=String(iso).split('-'); if(a.length===3) return a[2]+'-'+(m[a[1]]||a[1])+'-'+a[0]; return iso; }
function stockBanner(){ if(!db.stockDate) return ''; return '<div class="stockbar"><span>📅 Stock Date: '+esc(fmtStockDate(db.stockDate))+'</span><small>Isi date ka data bhar rahe hain • Old / gap data nahi</small></div>'; }
function techSummary(card){
  var map={}, total=0, filled=0;
  db.sites.filter(function(s){return s.card===card;}).forEach(function(s){
    var k=firstName(s.tech)||'Technician';
    if(!map[k]) map[k]={qty:0,sites:0,filled:0};
    map[k].sites++;
    db.dates.forEach(function(d){ if(!d.vis) return; var v=parseFloat(s.vals[d.label]); if(!isNaN(v)&&v>0){ map[k].qty+=v; map[k].filled++; filled++; } });
    total+=map[k].qty;
  });
  var rows=Object.keys(map).sort().map(function(k){ return '<div class="sumrow"><span>👨‍🔧 '+esc(k)+' <small style="color:#64748b">• '+map[k].filled+' entry / '+map[k].sites+' sites</small></span><b>'+map[k].qty+' L</b></div>'; }).join('');
  return {html:rows||'<div class="msg i">Abhi koi qty select nahi ki hai.</div>', total:total, filled:filled};
}
function openSubmitModal(){
  var s=techSummary(session.card);
  var m='<div class="modal-bg" id="submitModal"><div class="modal"><h2 style="margin:0 0 4px">Are you sure to Submit?</h2><p class="small" style="margin:0 0 10px">Submit ke baad aaj ke liye lock ho jayega. Edit nahi hoga.</p>'+stockBanner()+s.html+'<div class="sumtotal"><span>Total Diesel Qty</span><span>'+s.total+' L</span></div><div class="row" style="margin-top:14px"><button style="flex:1" onclick="closeSubmitModal()">Cancel</button><button class="g" style="flex:1" onclick="confirmSubmit()">✅ Yes, Submit &amp; Lock for the Day</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend', m);
}
function closeSubmitModal(){ var e=document.getElementById('submitModal'); if(e) e.remove(); }
function confirmSubmit(){ closeSubmitModal(); db.users[session.card].submitted=true; store.set(KEY,JSON.stringify(db)); remotePut('users/'+encodeURIComponent(session.card)+'/submitted',true); render(); }
function seed(){
  var raw=[
    ['IN-1016864','Prakash Nagar',27,'OTCINDUSRAJ15',55,'ok',8.5,0.24,'Kanahya lal Gupta'],
    ['IN-1028404','Nakamadar',61,'TELINDU3325000051',78,'ok',0.0,0.00,'Mukesh Choudhary'],
    ['IN-1029193','TILONIA PATAN',57,'TELINDU3325000035',50,'Not OK',28.1,0.78,'Norat Gujar'],
    ['IN-1016881','NarayanMandir',74,'TELINDU3325000038',61,'Not OK',11.5,0.32,'Raghuveer Singh'],
    ['IN-1078468','NARWAR',74,'TELINDU3325000034',79,'Not OK',0.0,0.00,'Ranjeet choudhary'],
    ['IN-1030378','Kesarganj',91,'RAJ454204',80,'Not OK',14.3,0.40,'Ranjeet Jat']
  ];
  var sites=raw.map(function(a){
    return {indus:a[0],site:a[1],stock:a[2],card:a[3],cur:a[4],req:a[5],hrs:a[6],avg:a[7],tech:a[8],vals:{},remark:''};
  });
  return {stockDate:'2026-11-13',admin:{password:'Admin@123',phone:'9649990010'},
    vis:JSON.parse(JSON.stringify(ALLVIS)),
    dates:[{label:'12-N',editable:true,vis:true},{label:'13-N',editable:true,vis:true},{label:'14-N',editable:false,vis:true}],
    sites:sites, users:{}};
}
function load(){
  var d=null;
  try{ d=JSON.parse(store.get(KEY)); }catch(e){}
  if(!d||!d.sites){ d=seed(); }
  d.users=d.users||{};
  if(!d.stockDate) d.stockDate='2026-11-13';
  if(!d.vis){ d.vis=JSON.parse(JSON.stringify(ALLVIS)); }
  (d.dates||[]).forEach(function(x){ if(x.vis===undefined) x.vis=true; });
  d.sites.forEach(function(s){ if(!d.users[s.card]) d.users[s.card]={password:last4(s.card),mustChange:true,submitted:false}; });
  store.set(KEY,JSON.stringify(d));
  return d;
}
var db=load();
var session=null;
try{ session=JSON.parse(store.get(SKEY)||'null'); }catch(e){}
var DB_URL='https://vrpower-diesel-default-rtdb.asia-southeast1.firebasedatabase.app';  /* <-- yahan Firebase Realtime Database ka URL paste karein, jaise https://vrpower-diesel-default-rtdb.firebaseio.com */
var pending=0, lastRemote=null;
function remotePut(path,v){
  if(!DB_URL) return;
  pending++;
  var done=function(){ pending=Math.max(0,pending-1); };
  fetch(DB_URL.replace(/\/$/,'')+'/db'+(path?'/'+path:'')+'.json',{method:'PUT',body:JSON.stringify(v)}).then(done).catch(done);
}
function norm(d){
  d.sites=(d.sites||[]).filter(function(x){return x;});
  d.sites.forEach(function(x){ x.vals=x.vals||{}; if(x.remark==null) x.remark=''; });
  d.users=d.users||{};
  if(!d.stockDate) d.stockDate='2026-11-13'; d.dates=d.dates||[];
  d.dates.forEach(function(x){ if(x.vis===undefined) x.vis=true; });
  if(!d.vis) d.vis=JSON.parse(JSON.stringify(ALLVIS));
  return d;
}
function save(){ store.set(KEY,JSON.stringify(db)); remotePut('',db); }
function applyRemote(d){ lastRemote=JSON.stringify(d); db=norm(d); store.set(KEY,JSON.stringify(db)); lastRaw=store.get(KEY); }
function remoteInit(){
  if(!DB_URL) return;
  fetch(DB_URL.replace(/\/$/,'')+'/db.json').then(function(r){return r.json();}).then(function(d){
    if(d&&d.sites){ applyRemote(d); render(); } else { remotePut('',db); }
  }).catch(function(){});
}
function remotePoll(){
  if(!DB_URL||pending>0) return;
  fetch(DB_URL.replace(/\/$/,'')+'/db.json').then(function(r){return r.json();}).then(function(d){
    if(!d||!d.sites||pending>0) return;
    if(JSON.stringify(d)===lastRemote) return;
    applyRemote(d);
    if(!session) return;
    if(session.role==='viewer'){ refreshViewer(); return; }
    var t=((document.activeElement||{}).tagName||'');
    if(!/INPUT|SELECT|TEXTAREA/.test(t)) render();
  }).catch(function(){});
}
function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function firstName(t){ return String(t==null?'':t).trim().split(/\s+/)[0]||''; }
function cellFor(key,s){
  if(key==='req') return s.req==='ok'?'<span class="badge ok">ok</span>':'<span class="badge no">NOK</span>';
  if(key==='site') return '<span class="sn" title="'+esc(s.site)+'">'+esc(s.site)+'</span>';
  return esc(s[key]);
}
var welcomed=false;
function welcomeView(){ return vrOneLoginView(); }
function vrOneLoginView(err){
  var rem=null; try{ rem=JSON.parse(store.get('VR_REMEMBER')||'null'); }catch(e){}
  return '<div class="vrone-fullpage"><div class="vrone-hero"><h2 class="vr-one-big">VR <span>ONE</span></h2><div class="gold-line"></div><div class="dept-label">Energy Department</div></div>'+
    (err?'<div style="max-width:480px;margin:0 auto;padding:0 20px"><div class="msg e">'+esc(err)+'</div></div>':'')+
    '<div class="vrone-login"><label>Username</label><input id="u" autocomplete="username" placeholder="Username / Card No" value="'+esc(rem?rem.u:'')+'">'+
    '<label>Password</label><div style="position:relative"><input id="p" type="password" autocomplete="current-password" placeholder="Password" value="'+esc(rem?rem.p:'')+'" style="padding-right:44px"><button class="g-eye" type="button" onclick="togglePw()">👁</button></div>'+
    '<label class="chk g-remember"><input type="checkbox" id="remember" '+(rem?'checked':'')+'> Save password</label>'+
    '<button class="g-btn" onclick="doLogin()">Log in</button>'+
    '<a class="g-forgot" onclick="forgotPw()">Forgot your password?</a></div></div>';
}
function togglePw(){ var x=document.getElementById('p'); if(!x) return; x.type=(x.type==='password'?'text':'password'); }
function forgotPw(){ alert('Please contact Admin to reset your password.'); }

function loginView(err){ return vrOneLoginView(err); }

function otpView(err){
  return '<div class="card"><h2>Admin OTP</h2>'+
    (err?'<div class="msg e">'+esc(err)+'</div>':'')+
    '<div class="msg i">OTP bheja gaya: <b>'+esc(otpPhone)+'</b> (demo mode)</div>'+
    '<div style="margin:10px 0"><span class="otp">'+pendingOtp+'</span></div>'+
    '<label>OTP daalein</label><input id="o" inputmode="numeric" maxlength="6">'+
    '<div style="margin-top:14px"><button class="p" style="width:100%" onclick="verifyOtp()">Verify</button></div></div>';
}
function doLogin(){
  var u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
  var rem=document.getElementById('remember'); if(rem&&rem.checked){ try{ store.set('VR_REMEMBER',JSON.stringify({u:u,p:p})); }catch(e){} } else if(rem){ try{ store.del('VR_REMEMBER'); }catch(e){} }
  if(u.toUpperCase()==='JITENDRA'){
    if(p!=='Jitendra@123') return render('Galat viewer password');
    session={role:'viewer'}; store.set(SKEY,JSON.stringify(session)); render(); return;
  }
  if(u.toUpperCase()==='ADMIN'){
    if(p!==db.admin.password) return render('Galat admin password');
    session={role:'admin'}; store.set(SKEY,JSON.stringify(session)); render();
    return;
  }
  var card=null;
  for(var c in db.users){ if(c.toUpperCase()===u.toUpperCase()){ card=c; break; } }
  if(!card) return render('Card number registered nahi hai');
  if(db.users[card].password!==p) return render('Galat password');
  session={role:'filler',card:card}; store.set(SKEY,JSON.stringify(session)); render();
}
function verifyOtp(){
  if(document.getElementById('o').value.trim()!==pendingOtp){ document.getElementById('app').innerHTML=otpView('Galat OTP'); return; }
  pendingOtp=null; session={role:'admin'}; store.set(SKEY,JSON.stringify(session)); render();
}
function logout(){ welcomed=false; fq=''; vq=''; session=null; store.del(SKEY); filters={}; render(); }

function uvals(sites,key){
  var seen={},out=[];
  sites.forEach(function(x){ var v=(key==='tech')?firstName(x.tech):(key==='card'&&session&&session.role==='filler')?cardDisp(x.card):String(x[key]==null?'':x[key]).trim(); if(v&&!seen[v]){ seen[v]=1; out.push(v); } });
  out.sort(function(a,b){ return a.localeCompare(b,undefined,{numeric:true}); });
  return out.slice(0,3000);
}
function dlists(sites,keys){
  return keys.filter(function(k){ return k!=='req'; }).map(function(k){
    return '<datalist id="dl_'+k+'">'+uvals(sites,k).map(function(v){ return '<option value="'+esc(v)+'">'; }).join('')+'</datalist>';
  }).join('');
}
function reqSel(fn){
  return '<select onchange="filters.req=this.value;'+fn+'"><option value="">All</option><option value="ok"'+(filters.req==='ok'?' selected':'')+'>ok</option><option value="Not OK"'+(filters.req==='Not OK'?' selected':'')+'>NOK</option></select>';
}
function clearFilters(){ filters={}; fq=''; vq=''; render(); }
function fpanel(items,fn){
  var act=Object.keys(filters).some(function(k){ return filters[k]; });
  var h='<details class="fp"'+(act?' open':'')+'><summary>Filters'+(act?' (on)':'')+'</summary><div class="fg">';
  items.forEach(function(c){
    var k=c[0];
    h+='<label><span>'+c[1]+'</span>';
    if(k==='req') h+='<select onchange="filters.req=this.value;'+fn+'"><option value="">All</option><option value="ok"'+(filters.req==='ok'?' selected':'')+'>ok</option><option value="Not OK"'+(filters.req==='Not OK'?' selected':'')+'>Not OK</option></select>';
    else if(k==='submitted') h+='<select onchange="filters.submitted=this.value;'+fn+'"><option value="">All</option><option value="1"'+(filters.submitted==='1'?' selected':'')+'>Submitted</option><option value="0"'+(filters.submitted==='0'?' selected':'')+'>Pending</option></select>';
    else h+='<input value="'+esc(filters[k]||'')+'" oninput="filters['+qq(k)+']=this.value;'+fn+'">';
    h+='</label>';
  });
  h+='</div><button onclick="clearFilters()">Filters clear</button></details>';
  return h;
}
var fq='';
function filterFiller(v){
  if(v!==undefined) fq=v;
  var q=fq.trim().toLowerCase();
  var r=document.querySelectorAll('#fb tr');
  for(var k=0;k<r.length;k++){
    var ok=!q||(r[k].getAttribute('data-q')||'').indexOf(q)>-1;
    if(ok){ for(var key in filters){ var fv=filters[key]; if(!fv) continue; var cv=r[k].getAttribute('data-f-'+key)||'';
      if(key==='req'){ if(cv!==fv){ ok=false; break; } } else if(cv.toLowerCase().indexOf(fv.toLowerCase())<0){ ok=false; break; } } }
    r[k].hidden=!ok;
  }
}
function fillerView(card){
  var u=db.users[card];
  var rows=db.sites.map(function(s,i){ return {s:s,i:i}; }).filter(function(o){ return o.s.card===card; });
  var frozen=u.submitted;

  var cols=[]; BASECOLS.forEach(function(c){ if(db.vis[c[0]]) cols.push(c); });
  var dcols=[]; db.dates.forEach(function(d){ if(d.vis) dcols.push(d); });
  var showRemark=!!db.vis.remark;

  if(!cols.length && !dcols.length && !showRemark){
    return '<div class="msg i">Admin ne abhi koi column aapke liye chalu nahi kiya hai.</div>';
  }

function matchFilter(s){
  for(var k in filters){
    var v=filters[k]; if(!v) continue;
    if(k==='req'){ if(s.req!==v) return false; }
    else if(k==='submitted'){ if((db.users[s.card]&&db.users[s.card].submitted?'1':'0')!==v) return false; }
    else if(k==='card'&&session&&session.role==='filler'){ if(cardDisp(s.card).toLowerCase().indexOf(v.toLowerCase())<0) return false; }
    else if(String(s[k]||'').toLowerCase().indexOf(v.toLowerCase())<0) return false;
  }
  return true;
}

function parseCsv(t){
  var rows=[], cur=[], cell='', q=false;
  var fl=t.split(LF)[0]||''; var D=','; var nc=fl.split(',').length, nt=fl.split(String.fromCharCode(9)).length, ns=fl.split(';').length;
  if(nt>nc&&nt>=ns) D=String.fromCharCode(9); else if(ns>nc) D=';';
  for(var i=0;i<t.length;i++){ var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===D){ cur.push(cell); cell=''; }
    else if(c===LF){ cur.push(cell); rows.push(cur); cur=[]; cell=''; }
    else if(c!==CR) cell+=c; }
  if(cell||cur.length){ cur.push(cell); rows.push(cur); }
  return rows.filter(function(r){ return r.some(function(c){ return c.trim(); }); });
}
function importCsv(){
  var f=document.getElementById('f').files[0], out=document.getElementById('upmsg');
  if(!f){ out.innerHTML='<div class="msg e">File chuno</div>'; return; }
  var rd=new FileReader();
  rd.onload=function(){
    var rows=parseCsv(rd.result);
    var hdr=rows.shift().map(function(h){ return h.toLowerCase().replace(/[^a-z0-9]/g,''); });
    function ix(al,fb){
      for(var k=0;k<al.length;k++){ var p=hdr.indexOf(al[k]); if(p>=0) return p; }
      if(fb){ for(var i=0;i<hdr.length;i++){ if(fb(hdr[i])) return i; } }
      return -1;
    }
    var m={
      indus:ix(['id','indusid','siteid']),
      site:ix(['sitename','site'],function(h){return h.indexOf('site')>=0;}),
      stock:ix(['fsstock','fuelerstock','fuelsensorstock'],function(h){return h.indexOf('fs')===0||h.indexOf('fuel')>=0;}),
      card:ix(['cardno','card'],function(h){return h.indexOf('card')>=0;}),
      cur:ix(['snmpstock','currentstock'],function(h){return h.indexOf('current')>=0;}),
      req:ix(['dieselreq','dieselrequirement'],function(h){return h.indexOf('diesel')>=0;}),
      hrs:ix(['snmpdgrh','totalsnmpdgrunhrs'],function(h){return h.indexOf('dg')>=0&&h.indexOf('avg')<0&&h.indexOf('perday')<0;}),
      avg:ix(['avgsnmprh','avgsnmprs','perdayavgdgrunhrs'],function(h){return h.indexOf('avg')>=0;}),
      tech:ix(['tech','technician','technicianname'],function(h){return h.indexOf('tech')>=0;})
    };
    if(m.indus<0||m.card<0||m.tech<0){ out.innerHTML='<div class="msg e">CSV me ID / Card No / Tech columns chahiye</div>'; return; }
    if(document.getElementById('rep').checked){ db.sites=[]; db.users={}; }
    var n=0;
    rows.forEach(function(r){
      var card=(r[m.card]||'').trim(); if(!card) return;
      db.sites.push({indus:(r[m.indus]||'').trim(),site:(r[m.site]||'').trim(),stock:(r[m.stock]||'').trim(),card:card,
        cur:(r[m.cur]||'').trim(),req:/not/i.test(r[m.req]||'')?'Not OK':'ok',hrs:(r[m.hrs]||'').trim(),avg:(r[m.avg]||'').trim(),tech:(r[m.tech]||'').trim(),vals:{},remark:''});
      if(!db.users[card]) db.users[card]={password:last4(card),mustChange:true,submitted:false};
      n++;
    });
    var sd=document.getElementById('stockDateInput'); if(sd&&sd.value){ db.stockDate=sd.value; } else if(!db.stockDate){ db.stockDate=new Date().toISOString().slice(0,10); } save(); out.innerHTML='<div class="msg o">'+n+' rows upload hui. Stock Date: '+fmtStockDate(db.stockDate)+'</div>';
  };
  rd.readAsText(f,'UTF-8');
}

var lastRaw=store.get(KEY);
function liveSync(){
  var raw=store.get(KEY);
  if(raw===lastRaw) return;
  lastRaw=raw;
  try{ var d=JSON.parse(raw); if(d&&d.sites){ db=d; } }catch(e){ return; }
  if(session&&session.role==='viewer') refreshViewer();
}
window.addEventListener('storage',function(e){ if(e.key===KEY) liveSync(); });
setInterval(liveSync,2000);

var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferredPrompt=e; var b=document.getElementById('inst'); if(b) b.style.display='inline-block'; });
document.getElementById('inst').onclick=function(){ if(!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt=null; document.getElementById('inst').style.display='none'; }); };
window.addEventListener('appinstalled',function(){ document.getElementById('inst').style.display='none'; });
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
remoteInit(); setInterval(remotePoll,3000);
setTimeout(function(){ var s=document.getElementById('splash'); if(s) s.classList.add('hide'); },1600);
try{ render(); }catch(e){
  var el=document.getElementById('err'); el.style.display='block'; el.textContent='BOOT: '+e.message;
}
</script>
</body>
</html>
