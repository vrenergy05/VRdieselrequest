<script>
var KEY='dsl_db_v1', SKEY='dsl_sess';
var LF=String.fromCharCode(10), CR=String.fromCharCode(13), BOM=String.fromCharCode(65279);
var QTY=[]; for(var qi=1;qi<=11;qi++){ QTY.push(qi*20); }
function last4(c){ return String(c).slice(-4); }
function qq(s){ return "'" + s + "'"; }
var filters={}, adminTab='data', pendingOtp=null, otpPhone='';

var BASECOLS=[['indus','ID'],['site','Site Name'],['stock','FS Stock'],['card','Card No'],
  ['cur','SNMP Stock'],['req','Diesel Req.'],['hrs','SNMP DG RH'],['avg','Avg SNMP RH'],['tech','Tech']];
var ALLVIS={indus:1,site:1,stock:1,card:1,cur:1,req:1,hrs:1,avg:1,tech:1,remark:1};

var mem={};
var store={
  get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del:function(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};

function seed(){
  var raw=[
    ['IN-1016864','Prakash Nagar',27,'OTCINDUSRAJ15',55,'ok',8.5,0.24,'Kanahya lal Gupta'],
    ['IN-1028404','Nakamadar',61,'TELINDU3325000051',78,'ok',0.0,0.00,'Mukesh Choudhary'],
    ['IN-1029193','TILONIA PATAN',57,'TELINDU3325000035',50,'Not OK',28.1,0.78,'Norat Gujar'],
    ['IN-1016881','NarayanMandir',74,'TELINDU3325000038',61,'Not OK',11.5,0.32,'Raghuveer Singh'],
    ['IN-1078468','NARWAR',74,'TELINDU3325000034',79,'Not OK',0.0,0.00,'Ranjeet choudhary'],
    ['IN-1030378','Kesarganj',91,'RAJ454204',80,'Not OK',14.3,0.40,'Ranjeet Jat']
  ];
  var sites=raw.map(function(a){
    return {indus:a[0],site:a[1],stock:a[2],card:a[3],cur:a[4],req:a[5],hrs:a[6],avg:a[7],tech:a[8],vals:{},remark:''};
  });
  return {admin:{password:'Admin@123',phone:'9649990010'},
    vis:JSON.parse(JSON.stringify(ALLVIS)),
    dates:[{label:'12-N',editable:true,vis:true},{label:'13-N',editable:true,vis:true},{label:'14-N',editable:false,vis:true}],
    sites:sites, users:{}};
}
function load(){
  var d=null;
  try{ d=JSON.parse(store.get(KEY)); }catch(e){}
  if(!d||!d.sites){ d=seed(); }
  d.users=d.users||{};
  if(!d.vis){ d.vis=JSON.parse(JSON.stringify(ALLVIS)); }
  (d.dates||[]).forEach(function(x){ if(x.vis===undefined) x.vis=true; });
  d.sites.forEach(function(s){ if(!d.users[s.card]) d.users[s.card]={password:last4(s.card),mustChange:true,submitted:false}; });
  store.set(KEY,JSON.stringify(d));
  return d;
}
var db=load();
var session=null;
try{ session=JSON.parse(store.get(SKEY)||'null'); }catch(e){}
var DB_URL='';  /* <-- yahan Firebase Realtime Database ka URL paste karein, jaise https://vrpower-diesel-default-rtdb.firebaseio.com */
var pending=0, lastRemote=null;
function remotePut(path,v){
  if(!DB_URL) return;
  pending++;
  var done=function(){ pending=Math.max(0,pending-1); };
  fetch(DB_URL.replace(/\/$/,'')+'/db'+(path?'/'+path:'')+'.json',{method:'PUT',body:JSON.stringify(v)}).then(done).catch(done);
}
function norm(d){
  d.sites=(d.sites||[]).filter(function(x){return x;});
  d.sites.forEach(function(x){ x.vals=x.vals||{}; if(x.remark==null) x.remark=''; });
  d.users=d.users||{}; d.dates=d.dates||[];
  d.dates.forEach(function(x){ if(x.vis===undefined) x.vis=true; });
  if(!d.vis) d.vis=JSON.parse(JSON.stringify(ALLVIS));
  return d;
}
function save(){ store.set(KEY,JSON.stringify(db)); remotePut('',db); }
function applyRemote(d){ lastRemote=JSON.stringify(d); db=norm(d); store.set(KEY,JSON.stringify(db)); lastRaw=store.get(KEY); }
function remoteInit(){
  if(!DB_URL) return;
  fetch(DB_URL.replace(/\/$/,'')+'/db.json').then(function(r){return r.json();}).then(function(d){
    if(d&&d.sites){ applyRemote(d); render(); } else { remotePut('',db); }
  }).catch(function(){});
}
function remotePoll(){
  if(!DB_URL||pending>0) return;
  fetch(DB_URL.replace(/\/$/,'')+'/db.json').then(function(r){return r.json();}).then(function(d){
    if(!d||!d.sites||pending>0) return;
    if(JSON.stringify(d)===lastRemote) return;
    applyRemote(d);
    if(!session) return;
    if(session.role==='viewer'){ refreshViewer(); return; }
    var t=((document.activeElement||{}).tagName||'');
    if(!/INPUT|SELECT|TEXTAREA/.test(t)) render();
  }).catch(function(){});
}
function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function cellFor(key,s){
  if(key==='req') return s.req==='ok'?'<span class="badge ok">ok</span>':'<span class="badge no">Not OK</span>';
  return esc(s[key]);
}

function doLogin(){
  var u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
  if(u.toUpperCase()==='JITENDRA'){
    if(p!=='Jitendra@123') return render('Galat viewer password');
    session={role:'viewer'}; store.set(SKEY,JSON.stringify(session)); render(); return;
  }
  if(u.toUpperCase()==='ADMIN'){
    if(p!==db.admin.password) return render('Galat admin password');
    pendingOtp=String(Math.floor(100000+Math.random()*900000));
    otpPhone=db.admin.phone.replace(/^(\d{3})\d{6}(\d+)$/,'$1******$2');
    document.getElementById('app').innerHTML=otpView();
    return;
  }
  var card=null;
  for(var c in db.users){ if(c.toUpperCase()===u.toUpperCase()){ card=c; break; } }
  if(!card) return render('Card number registered nahi hai');
  if(db.users[card].password!==p) return render('Galat password');
  session={role:'filler',card:card}; store.set(SKEY,JSON.stringify(session)); render();
}
function verifyOtp(){
  if(document.getElementById('o').value.trim()!==pendingOtp){ document.getElementById('app').innerHTML=otpView('Galat OTP'); return; }
  pendingOtp=null; session={role:'admin'}; store.set(SKEY,JSON.stringify(session)); render();
}
function logout(){ welcomed=false; fq=''; vq=''; session=null; store.del(SKEY); filters={}; render(); }

function clearFilters(){ filters={}; fq=''; vq=''; render(); }
function fpanel(items,fn){
  var act=Object.keys(filters).some(function(k){ return filters[k]; });
  var h='<details class="fp"'+(act?' open':'')+'><summary>Filters'+(act?' (on)':'')+'</summary><div class="fg">';
  items.forEach(function(c){
    var k=c[0];
    h+='<label><span>'+c[1]+'</span>';
    if(k==='req') h+='<select onchange="filters.req=this.value;'+fn+'"><option value="">All</option><option value="ok"'+(filters.req==='ok'?' selected':'')+'>ok</option><option value="Not OK"'+(filters.req==='Not OK'?' selected':'')+'>Not OK</option></select>';
    else if(k==='submitted') h+='<select onchange="filters.submitted=this.value;'+fn+'"><option value="">All</option><option value="1"'+(filters.submitted==='1'?' selected':'')+'>Submitted</option><option value="0"'+(filters.submitted==='0'?' selected':'')+'>Pending</option></select>';
    else h+='<input value="'+esc(filters[k]||'')+'" oninput="filters['+qq(k)+']=this.value;'+fn+'">';
    h+='</label>';
  });
  h+='</div><button onclick="clearFilters()">Filters clear</button></details>';
  return h;
}
var fq='';
function filterFiller(v){
  if(v!==undefined) fq=v;
  var q=fq.trim().toLowerCase();
  var r=document.querySelectorAll('#fb tr');
  for(var k=0;k<r.length;k++){
    var ok=!q||(r[k].getAttribute('data-q')||'').indexOf(q)>-1;
    if(ok){ for(var key in filters){ var fv=filters[key]; if(!fv) continue; var cv=r[k].getAttribute('data-f-'+key)||'';
      if(key==='req'){ if(cv!==fv){ ok=false; break; } } else if(cv.toLowerCase().indexOf(fv.toLowerCase())<0){ ok=false; break; } } }
    r[k].style.display=ok?'':'none';
  }
}
function fillerView(card){
  var u=db.users[card];
  var rows=db.sites.map(function(s,i){ return {s:s,i:i}; }).filter(function(o){ return o.s.card===card; });
  var frozen=u.submitted;

  var cols=[]; BASECOLS.forEach(function(c){ if(db.vis[c[0]]) cols.push(c); });
  var dcols=[]; db.dates.forEach(function(d){ if(d.vis) dcols.push(d); });
  var showRemark=!!db.vis.remark;

  if(!cols.length && !dcols.length && !showRemark){
    return '<div class="msg i">Admin ne abhi koi column aapke liye chalu nahi kiya hai.</div>';
  }

  var head='';
  cols.forEach(function(c){ head+='<th>'+c[1]+'</th>'; });
  dcols.forEach(function(d){ head+='<th class="date">'+esc(d.label)+'</th>'; });
  if(showRemark) head+='<th>Remark</th>';

  var body=rows.map(function(o){
    var s=o.s, i=o.i, cells='';
    cols.forEach(function(c){ cells+='<td data-label="'+c[1]+'">'+cellFor(c[0],s)+'</td>'; });
    dcols.forEach(function(d){
      var v=s.vals[d.label]||'';
      var lab='data-label="'+esc(d.label)+'"';
      if(!(!frozen&&d.editable)){ cells+='<td class="date" '+lab+'>'+esc(v)+'</td>'; return; }
      var opt='<option value=""></option>';
      QTY.forEach(function(q){ opt+='<option '+(v==q?'selected':'')+'>'+q+'</option>'; });
      cells+='<td class="date" '+lab+'><select onchange="setVal('+i+','+qq(esc(d.label))+',this.value)">'+opt+'</select></td>';
    });
    if(showRemark){
      cells+='<td data-label="Remark">'+(frozen?esc(s.remark):'<input maxlength="20" value="'+esc(s.remark)+'" oninput="setRemark('+i+',this.value)">')+'</td>';
    }
    var dq=BASECOLS.map(function(c){ return String(s[c[0]]==null?'':s[c[0]]); }).join(' ').toLowerCase();
    var show=matchFilter(s)&&(!fq.trim()||dq.indexOf(fq.trim().toLowerCase())>-1);
    var hide=show?'':' style="display:none"';
    var fa=''; BASECOLS.forEach(function(c){ fa+=' data-f-'+c[0]+'="'+esc(String(s[c[0]]==null?'':s[c[0]]))+'"'; });
    return '<tr data-q="'+esc(dq)+'"'+fa+hide+'>'+cells+'</tr>';
  }).join('');

  var h='<div class="row" style="margin-bottom:10px"><div><b>Card:</b> '+esc(card)+'</div>';
  if(frozen) h+='<span class="badge ok">SUBMITTED - view only</span>';
  h+='<span style="flex:1"></span><button onclick="changePw('+qq(esc(card))+')">Password change</button><button class="d" onclick="logout()">Logout</button></div>';
  if(frozen) h+='<div class="msg o">Aapka data submit ho chuka hai. Ab sirf dekh sakte hain.</div>';
  if(rows.length){
    h+='<div class="row" style="margin-bottom:8px;flex-wrap:nowrap"><input type="search" placeholder="Search: Site ID / Site Name / Technician" value="'+esc(fq)+'" oninput="filterFiller(this.value)" style="flex:1;min-height:40px;padding:8px 12px;font-size:14px"></div>'+fpanel(cols,'filterFiller()');
    h+='<div class="tw ft fit"><table><thead class="nofilter"><tr>'+head+'</tr></thead><tbody id="fb">'+body+'</tbody></table></div>';
  } else {
    h+='<div class="msg i">Aapke card par koi site nahi hai.</div>';
  }
  if(!frozen) h+='<div class="sticky-submit"><button class="g" onclick="submitAll()">Submit (ek baar - baad me freeze)</button></div>';
  return h;
}

function matchFilter(s){
  for(var k in filters){
    var v=filters[k]; if(!v) continue;
    if(k==='req'){ if(s.req!==v) return false; }
    else if(k==='submitted'){ if((db.users[s.card]&&db.users[s.card].submitted?'1':'0')!==v) return false; }
    else if(String(s[k]||'').toLowerCase().indexOf(v.toLowerCase())<0) return false;
  }
  return true;
}
function fInput(col){ return '<input value="'+esc(filters[col]||'')+'" oninput="filters['+qq(col)+']=this.value;refreshData()">'; }

    db.dates.forEach(function(d){ c+='<td class="date" data-label="'+esc(d.label)+'">'+esc(s.vals[d.label]||'')+'</td>'; });
    c+='<td data-label="Remark">'+esc(s.remark)+'</td>';

function refreshData(){
  var ae=document.activeElement, idx=-1, pos=0, ins=document.querySelectorAll('#app thead input, #app .fg input');
  for(var i=0;i<ins.length;i++){ if(ins[i]===ae){ idx=i; pos=ae.selectionStart; } }
  document.getElementById('app').innerHTML=adminView();
  if(idx>=0){ var n=document.querySelectorAll('#app thead input, #app .fg input')[idx]; if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }
}
function exportCsv(){
  var cols=['ID','Site Name','FS Stock','Card No','SNMP Stock','Diesel Req.','SNMP DG RH','Avg SNMP RH','Tech'].concat(db.dates.map(function(d){return d.label;})).concat(['Remark','Submitted']);
  function q(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
  var lines=[cols.map(q).join(',')];
  db.sites.filter(matchFilter).forEach(function(s){
    var row=[s.indus,s.site,s.stock,s.card,s.cur,s.req,s.hrs,s.avg,s.tech].concat(db.dates.map(function(d){return s.vals[d.label]||'';})).concat([s.remark,(db.users[s.card]&&db.users[s.card].submitted)?'Yes':'No']);
    lines.push(row.map(q).join(','));
  });
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([BOM+lines.join(CR+LF)],{type:'text/csv;charset=utf-8'}));
  a.download='diesel_data_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}
function uploadTab(){
  return '<div class="msg i">CSV columns: ID, Site Name, FS Stock, Card No, SNMP Stock, Diesel Req., SNMP DG RH, Avg SNMP RH, Tech</div>'+
    '<div class="row"><input type="file" id="f" accept=".csv" class="grow">'+
    '<label style="display:flex;gap:6px;align-items:center;font-weight:400"><input type="checkbox" id="rep" style="width:auto"> pehle ka data hatao</label>'+
    '<button class="p" onclick="importCsv()">Upload</button></div><div id="upmsg"></div>';
}
function parseCsv(t){
  var rows=[], cur=[], cell='', q=false;
  var fl=t.split(LF)[0]||''; var D=','; var nc=fl.split(',').length, nt=fl.split(String.fromCharCode(9)).length, ns=fl.split(';').length;
  if(nt>nc&&nt>=ns) D=String.fromCharCode(9); else if(ns>nc) D=';';
  for(var i=0;i<t.length;i++){ var c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===D){ cur.push(cell); cell=''; }
    else if(c===LF){ cur.push(cell); rows.push(cur); cur=[]; cell=''; }
    else if(c!==CR) cell+=c; }
  if(cell||cur.length){ cur.push(cell); rows.push(cur); }
  return rows.filter(function(r){ return r.some(function(c){ return c.trim(); }); });
}
function importCsv(){
  var f=document.getElementById('f').files[0], out=document.getElementById('upmsg');
  if(!f){ out.innerHTML='<div class="msg e">File chuno</div>'; return; }
  var rd=new FileReader();
  rd.onload=function(){
    var rows=parseCsv(rd.result);
    var hdr=rows.shift().map(function(h){ return h.toLowerCase().replace(/[^a-z0-9]/g,''); });
    function ix(al,fb){
      for(var k=0;k<al.length;k++){ var p=hdr.indexOf(al[k]); if(p>=0) return p; }
      if(fb){ for(var i=0;i<hdr.length;i++){ if(fb(hdr[i])) return i; } }
      return -1;
    }
    var m={
      indus:ix(['id','indusid','siteid']),
      site:ix(['sitename','site'],function(h){return h.indexOf('site')>=0;}),
      stock:ix(['fsstock','fuelerstock','fuelsensorstock'],function(h){return h.indexOf('fs')===0||h.indexOf('fuel')>=0;}),
      card:ix(['cardno','card'],function(h){return h.indexOf('card')>=0;}),
      cur:ix(['snmpstock','currentstock'],function(h){return h.indexOf('current')>=0;}),
      req:ix(['dieselreq','dieselrequirement'],function(h){return h.indexOf('diesel')>=0;}),
      hrs:ix(['snmpdgrh','totalsnmpdgrunhrs'],function(h){return h.indexOf('dg')>=0&&h.indexOf('avg')<0&&h.indexOf('perday')<0;}),
      avg:ix(['avgsnmprh','avgsnmprs','perdayavgdgrunhrs'],function(h){return h.indexOf('avg')>=0;}),
      tech:ix(['tech','technician','technicianname'],function(h){return h.indexOf('tech')>=0;})
    };
    if(m.indus<0||m.card<0||m.tech<0){ out.innerHTML='<div class="msg e">CSV me ID / Card No / Tech columns chahiye</div>'; return; }
    if(document.getElementById('rep').checked){ db.sites=[]; db.users={}; }
    var n=0;
    rows.forEach(function(r){
      var card=(r[m.card]||'').trim(); if(!card) return;
      db.sites.push({indus:(r[m.indus]||'').trim(),site:(r[m.site]||'').trim(),stock:(r[m.stock]||'').trim(),card:card,
        cur:(r[m.cur]||'').trim(),req:/not/i.test(r[m.req]||'')?'Not OK':'ok',hrs:(r[m.hrs]||'').trim(),avg:(r[m.avg]||'').trim(),tech:(r[m.tech]||'').trim(),vals:{},remark:''});
      if(!db.users[card]) db.users[card]={password:last4(card),mustChange:true,submitted:false};
      n++;
    });
    save(); out.innerHTML='<div class="msg o">'+n+' rows upload hui.</div>';
  };
  rd.readAsText(f,'UTF-8');
}
function usersTab(){
  var seen={}, cards=[];
  db.sites.forEach(function(s){ if(!seen[s.card]){ seen[s.card]=1; cards.push(s.card); } });
  var rows=cards.map(function(c){
    var u=db.users[c]||{};
    var tech=''; for(var i=0;i<db.sites.length;i++){ if(db.sites[i].card===c){ tech=db.sites[i].tech; break; } }
    return '<tr><td data-label="Card No">'+esc(c)+'</td><td data-label="Tech">'+esc(tech)+'</td>'+
      '<td data-label="Password"><input value="'+esc(u.password||'')+'" onchange="setPw('+qq(esc(c))+',this.value)"></td>'+
      '<td data-label="Submitted">'+(u.submitted?'<span class="badge ok">Yes</span>':'<span class="badge">No</span>')+'</td>'+
      '<td data-label="Action"><div class="row"><button onclick="resetPw('+qq(esc(c))+')">Reset to last4</button>'+
      '<button onclick="toggleLock('+qq(esc(c))+')">'+(u.submitted?'Unlock':'Lock')+'</button></div></td></tr>';
  }).join('');
  return '<div class="msg i">Default password = card ke last 4 digit. Yahan se badal sakte hain, submitted lock bhi hata sakte hain.</div>'+
    '<div class="tw"><table><thead class="nofilter"><tr><th>Card No</th><th>Tech</th><th>Password (admin set)</th><th>Submitted</th><th></th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="5">Koi filler nahi</td></tr>')+'</tbody></table></div>';
}
function setPw(c,v){ db.users[c].password=v; db.users[c].mustChange=false; save(); }
function resetPw(c){ db.users[c].password=last4(c); save(); render(); }
function toggleLock(c){ db.users[c].submitted=!db.users[c].submitted; save(); render(); }

function colsTab(){
  var base=BASECOLS.map(function(c){
    return '<label class="chk"><input type="checkbox" '+(db.vis[c[0]]?'checked':'')+' onchange="setVis('+qq(c[0])+',this.checked)"> '+
      c[1]+(c[0]==='req'?' (ok / Not OK)':'')+'</label>';
  }).join('');
  var extra='<label class="chk"><input type="checkbox" '+(db.vis.remark?'checked':'')+' onchange="setVis('+qq('remark')+',this.checked)"> Remark</label>';

  var dates=db.dates.map(function(d,i){
    return '<div class="card" style="margin:0;max-width:none">'+
      '<label>Date column label</label><input value="'+esc(d.label)+'" onchange="setDateLabel('+i+',this.value)">'+
      '<label class="chk" style="margin-top:8px"><input type="checkbox" '+(d.vis?'checked':'')+' onchange="setDateVis('+i+',this.checked)"> Filler ko dikhe</label>'+
      '<label class="chk" style="margin-top:6px"><input type="checkbox" '+(d.editable?'checked':'')+' onchange="setDateEdit('+i+',this.checked)"> Editable</label>'+
      '<button class="d" style="margin-top:8px" onclick="delDate('+i+')">Delete</button></div>';
  }).join('');

  return '<div class="msg i">Jo column tick hoga wahi filler ko dikhega. Bina tick wala column filler ki screen par nahi aayega (data safe rahega).</div>'+
    '<h2 style="font-size:14px;margin:12px 0 8px">Filler ko dikhne wale columns</h2>'+
    '<div class="grid3">'+base+extra+'</div>'+
    '<div class="row" style="margin:10px 0"><button onclick="allVis(1)">Sab dikhao</button><button onclick="allVis(0)">Sab chhupao</button></div>'+
    '<h2 style="font-size:14px;margin:18px 0 8px">Date columns (max 3)</h2>'+
    '<div class="grid3">'+dates+'</div>'+
    '<div style="margin-top:12px"><button class="p" '+(db.dates.length>=3?'disabled':'')+' onclick="addDate()">+ Date column</button></div>';
}
function setVis(k,v){ db.vis[k]=v?1:0; save(); render(); }
function allVis(v){ for(var k in ALLVIS){ db.vis[k]=v?1:0; } db.dates.forEach(function(d){ d.vis=!!v; }); save(); render(); }
function setDateLabel(i,v){ db.dates[i].label=v; save(); render(); }
function setDateVis(i,v){ db.dates[i].vis=v; save(); render(); }
function setDateEdit(i,v){ db.dates[i].editable=v; save(); render(); }
function delDate(i){ db.dates.splice(i,1); save(); render(); }
function addDate(){ db.dates.push({label:'',editable:true,vis:true}); save(); render(); }

function settingsTab(){
  return '<div class="grid3">'+
    '<div class="card" style="margin:0;max-width:none"><h2>Admin password</h2><label>Naya password</label><input type="password" id="np" placeholder="........">'+
    '<label>Dobara</label><input type="password" id="np2" placeholder="........">'+
    '<button class="p" style="margin-top:10px" onclick="chAdminPw()">Change</button></div>'+
    '<div class="card" style="margin:0;max-width:none"><h2>OTP number</h2><input id="ph" value="'+esc(db.admin.phone)+'">'+
    '<button class="p" style="margin-top:10px" onclick="savePhone()">Save</button></div>'+
    '<div class="card" style="margin:0;max-width:none"><h2>Danger</h2><button class="d" onclick="resetAll()">Reset all data</button></div></div>';
}
function savePhone(){ db.admin.phone=document.getElementById('ph').value.trim(); save(); alert('Save ho gaya'); }
function resetAll(){
  if(!confirm('Sab data mitayein?')) return;
  store.del(KEY); db=load(); remotePut('',db); render();
}
function chAdminPw(){
  var a=document.getElementById('np').value, b=document.getElementById('np2').value;
  if(a.length<4) return alert('Min 4');
  if(a!==b) return alert('Match nahi');
  db.admin.password=a; save(); alert('Admin password badal gaya');
}
function render(err){
  var h=document.getElementById('hdr');
  h.innerHTML = session ? '<span class="small" style="color:#bbb">'+(session.role==='admin'?'admin':session.role==='viewer'?'Jitendra (View Only)':esc(session.card))+'</span>' : '';
  var app=document.getElementById('app');
  if(!session){ app.innerHTML=(welcomed||err)?loginView(err):welcomeView(); return; }
  if(session.role==='admin'){ app.innerHTML=adminView(); return; }
  if(session.role==='viewer'){ app.innerHTML=viewerView(); return; }
  app.innerHTML=fillerView(session.card);
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  var o=document.getElementById('o'); if(o){ verifyOtp(); return; }
  var u=document.getElementById('u'); if(u){ doLogin(); }
});

var lastRaw=store.get(KEY);
function liveSync(){
  var raw=store.get(KEY);
  if(raw===lastRaw) return;
  lastRaw=raw;
  try{ var d=JSON.parse(raw); if(d&&d.sites){ db=d; } }catch(e){ return; }
  if(session&&session.role==='viewer') refreshViewer();
}
window.addEventListener('storage',function(e){ if(e.key===KEY) liveSync(); });
setInterval(liveSync,2000);

var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferredPrompt=e; var b=document.getElementById('inst'); if(b) b.style.display='inline-block'; });
document.getElementById('inst').onclick=function(){ if(!deferredPrompt) return; deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt=null; document.getElementById('inst').style.display='none'; }); };
window.addEventListener('appinstalled',function(){ document.getElementById('inst').style.display='none'; });
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
remoteInit(); setInterval(remotePoll,3000);
try{ render(); }catch(e){
  var el=document.getElementById('err'); el.style.display='block'; el.textContent='BOOT: '+e.message;
}
</script>
</body>
</html>
